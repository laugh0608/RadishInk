worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # 不记录查询串、OIDC 授权码或私有资源路径。
    access_log off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    server {
        # Nginx 请求错误也可能附带授权码或私有路径；启动诊断仍输出 stderr。
        error_log /dev/null;
        listen 8080;
        server_name _;
        root /tmp/radishink-web/www;
        index index.html;
        absolute_redirect off;
        gzip on;
        gzip_types text/plain text/css application/json application/javascript image/svg+xml;
        location = /_radishink_health { access_log off; return 200 "ready\n"; }
        @@API_LOCATION@@
        # API 路径永不退回 SPA，也不按图片扩展名设置 public 缓存。
        location ~ /api(?:/|$) { add_header Cache-Control "no-store" always; return 404; }
        location = @@BASE@@sw.js { add_header Cache-Control "no-cache" always; }
        location = @@BASE@@registerSW.js { add_header Cache-Control "no-cache" always; }
        location = @@BASE@@pwa-update-guard.js { add_header Cache-Control "no-cache" always; }
        location ~ ^@@BASE@@assets/ { try_files $uri =404; add_header Cache-Control "public, max-age=31536000, immutable"; }
        location @@BASE@@ {
            try_files $uri $uri/ @@BASE@@index.html;
            add_header Cache-Control "no-cache, must-revalidate" always;
        }
        @@OUTSIDE_LOCATION@@
    }
}
