name: Publish images and Release

on:
  push:
    tags: ["v*-test", "v*-release"]

permissions:
  contents: read

concurrency:
  group: radishink-publish
  queue: max
  cancel-in-progress: false

jobs:
  quality:
    uses: ./.github/workflows/ci.yml

  publish:
    if: github.repository == 'laugh0608/RadishInk'
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
      packages: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_DIR: output/distribution/release
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RADISHINK_GHCR_USER: ${{ github.actor }}
      RADISHINK_GHCR_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Validate version and check for a previous release
        id: release
        shell: bash
        run: |
          revision=$(git rev-parse HEAD)
          test "$revision" = "$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")"
          node scripts/release-metadata.mjs --tag "$RELEASE_TAG" --revision "$revision" --source-version version.json --format github >> "$GITHUB_OUTPUT"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          existing=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --slurp |
            jq -c --arg tag "$RELEASE_TAG" 'first(.[][] | select(.tag_name == $tag)) // null')
          if [[ "$existing" == null ]]; then
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          else
            if ! jq -e --arg tag "$RELEASE_TAG" '
              .draft == false and .prerelease == ($tag | endswith("-test")) and
              ([.assets[].name] | contains(["release-pair.json", "release-lock-amd64.json",
                "release-lock-arm64.json"]))
            ' <<< "$existing" >/dev/null; then
              echo 'Existing Release has a draft, unexpected track, or missing assets. Review it before retrying.' >&2
              exit 1
            fi
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-qemu-action@v4
        if: steps.release.outputs.exists == 'false'
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build the Web candidate by digest
        id: web
        if: steps.release.outputs.exists == 'false'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          labels: ${{ steps.release.outputs.labels }}
          outputs: type=image,name=ghcr.io/laugh0608/radishink-web,push-by-digest=true,name-canonical=true,push=true
      - name: Build the Server candidate by digest
        id: server
        if: steps.release.outputs.exists == 'false'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/server/Dockerfile
          platforms: linux/amd64,linux/arm64
          labels: ${{ steps.release.outputs.labels }}
          outputs: type=image,name=ghcr.io/laugh0608/radishink-server,push-by-digest=true,name-canonical=true,push=true

      - name: Verify the pair and create GitHub Release
        if: steps.release.outputs.exists == 'false'
        env:
          REVISION: ${{ steps.release.outputs.revision }}
          WEB_INDEX: ${{ steps.web.outputs.digest }}
          SERVER_INDEX: ${{ steps.server.outputs.digest }}
        shell: bash
        run: |
          node --use-env-proxy scripts/distribution/release-pair.mjs --pull \
            --tag "$RELEASE_TAG" --revision "$REVISION" \
            --web-index "$WEB_INDEX" --server-index "$SERVER_INDEX" \
            --output "$RELEASE_DIR"
          track_flags=(--latest=false)
          if [[ "$RELEASE_TAG" == *-test ]]; then track_flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" "$RELEASE_DIR"/*.json \
            --verify-tag --title "$RELEASE_TAG" "${track_flags[@]}" \
            --notes "仓库源码由 GitHub 随 tag 提供。第三方来源和许可见[镜像分发说明]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$REVISION/docs/deployment/image-distribution.md)。双镜像摘要和部署锁文件见附件。发布结果见 [Actions]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)。"

      - name: Restore the release record on retry
        if: steps.release.outputs.exists == 'true'
        shell: bash
        run: gh release download "$RELEASE_TAG" --pattern release-pair.json --dir "$RELEASE_DIR"

      - name: Check both version tags, publish and read back their digests
        shell: bash
        run: |
          record="$RELEASE_DIR/release-pair.json"
          jq -e --arg tag "$RELEASE_TAG" '.tag == $tag' "$record" >/dev/null
          checks=$(node --use-env-proxy scripts/distribution/release-pair.mjs --check-tags "$record")
          images=$(jq -r '.[] | ["ghcr.io/laugh0608/radishink-" + .component, .digest, .state] | @tsv' <<< "$checks")
          while read -r image digest state; do
            if [[ "$state" == absent ]]; then
              docker buildx imagetools create --tag "$image:$RELEASE_TAG" "$image@$digest"
            fi
          done <<< "$images"
          while read -r image digest state; do
            actual=$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$image:$RELEASE_TAG")
            if [[ "$actual" != "$digest" ]]; then
              echo "Published digest differs for $image:$RELEASE_TAG" >&2
              exit 1
            fi
          done <<< "$images"

          # An older retry must not move aliases back from a newer release.
          published=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq .published_at)
          newer=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --slurp |
            jq --arg track "${RELEASE_TAG##*-}" --arg published "$published" '
              any(.[][]; .draft == false and (.tag_name | endswith("-" + $track)) and .published_at > $published)')
          if [[ "$newer" == false ]]; then
            while read -r image digest state; do
              aliases=(--tag "$image:${RELEASE_TAG##*-}-latest")
              if [[ "$RELEASE_TAG" == *-release ]]; then aliases+=(--tag "$image:latest"); fi
              docker buildx imagetools create "${aliases[@]}" "$image@$digest"
            done <<< "$images"
            if [[ "$RELEASE_TAG" == *-release ]]; then gh release edit "$RELEASE_TAG" --latest; fi
          fi
