# 停用中的构建模板；发布须另接源码伴随包、双镜像记录和不可覆盖保护。
name: Docker Image

on:
  push:
    tags:
      - "v*-dev"
      - "v*-test"
      - "v*-release"

permissions:
  contents: read

jobs:
  build-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        component: [web, server]
        include:
          - component: web
            dockerfile: Dockerfile
          - component: server
            dockerfile: apps/server/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Validate tag and generate image metadata
        id: meta
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          COMPONENT: ${{ matrix.component }}
          SOURCE_REVISION: ${{ github.sha }}
        run: node scripts/release-metadata.mjs --tag "${RELEASE_TAG}" --component "${COMPONENT}" --revision "${SOURCE_REVISION}" --source-version version.json --format github >> "${GITHUB_OUTPUT}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # No registry mutation until the paired publication prerequisites are wired.
      - name: Build OCI candidate without publication
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          outputs: type=oci,dest=/tmp/${{ matrix.component }}.tar
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
