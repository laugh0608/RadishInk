name: 功能或改进建议
description: 从写作与公众号排版场景描述建议
title: "[建议]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: 用户场景与问题
      description: 目前哪里不方便，现有方案有什么限制
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议行为与验收
      description: 期望怎样操作、怎样判断完成，以及可接受的替代方案
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: 影响范围
      description: 是否需要外部服务、账号、存储迁移、付费依赖或新资产
